<style>
/* Layout: a fixed right-hand rail (RTL) beside one full-height working view; the reader takes the whole screen. */

:root[data-skin="light"] {

:root[data-skin="dark"] {
  --paper: #121514; --surface: #1A1F1D; --surface-2: #222826; --ink: #E5E8E3; --muted: #9AA39E; --line: #2E3532;

html, body { height: 100%; }

  background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.6;

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* App shell */
#app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100%; }
#rail {
  display: flex; flex-direction: column; align-items: stretch; gap: 4px; background: var(--surface);
  border-inline-end: 1px solid var(--line); padding-block: 14px; padding-inline-start: env(safe-area-inset-right, 0px);

.brand { font-family: var(--font-display); font-weight: 700; font-size: 30px; text-align: center; color: var(--accent); line-height: 1; padding-block: 6px 14px; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px;

.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: none; border-color: transparent; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: none; display: grid; place-items: center; color: inherit; }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-size: 14px; min-height: 36px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 14px; min-height: 44px; width: 100%; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper);
  padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 100; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}

/* Library shelves */
.shelf {
  --row: 330px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: var(--row); column-gap: 28px;
  padding-inline: 28px; border-radius: 6px; position: relative;
  background:
    repeating-linear-gradient(to bottom, transparent 0 calc(var(--row) - 22px), var(--sh-hi) calc(var(--row) - 22px) calc(var(--row) - 19px), var(--sh-board) calc(var(--row) - 19px) calc(var(--row) - 6px), var(--sh-lo) calc(var(--row) - 6px) var(--row)),
    var(--sh-grain),
    linear-gradient(to bottom, var(--sh-back), var(--sh-back));
  box-shadow: inset 0 0 0 1px var(--line), inset 0 14px 28px -16px rgba(0,0,0,.35);
  color: var(--sh-ink);
}
.shelf, .shelf-tabs .sw, .theme-prev, .menu .sw {
  --sh-back: #E6DED3; --sh-hi: #8A6142; --sh-board: #5B3F2C; --sh-lo: #3B281B; --sh-ink: #2A1F17; --sh-grain: none;
  --grain: repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 1px, transparent 1px 7px, rgba(255,255,255,.05) 7px 8px, transparent 8px 13px);

.empty-shelf { display: grid; place-items: center; align-content: center; gap: 14px; grid-template-columns: 1fr; grid-auto-rows: auto; min-height: 330px; padding: 32px 24px 60px; text-align: center; }

.shelf .book-meta, .shelf .book .more { color: var(--sh-ink); }
.local-badge { position: absolute; top: 18px; inset-inline-start: 6px; background: var(--ink); color: var(--paper); font-size: 11px; padding: 1px 8px; border-radius: 999px; }

.shelf-tabs { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 14px; scrollbar-width: thin; }
.shelf-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 42px; white-space: nowrap; font-size: 15px; flex: none; }
.shelf-chip[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.shelf-chip .n { font-size: 12px; opacity: .7; }
.shelf-chip.add { border-style: dashed; color: var(--muted); background: none; }
.shelf-chip .icon { width: 18px; height: 18px; }
.sw { display: inline-block; width: 16px; height: 16px; border-radius: 4px; flex: none; background: linear-gradient(var(--sh-back) 0 55%, var(--sh-hi) 55% 62%, var(--sh-board) 62% 85%, var(--sh-lo) 85%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.shelf-name-in { width: 220px; flex: none; min-height: 42px; }
.customize { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-bottom: 16px; display: grid; gap: 14px; }
.cz-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.cz-row > b { min-width: 9em; font-weight: 600; }
.cz-row .input { max-width: 320px; }
.theme-grid { display: flex; gap: 10px; flex-wrap: wrap; }
.theme-opt { display: grid; justify-items: center; gap: 6px; border: 2px solid transparent; background: none; border-radius: 14px; padding: 6px; font-size: 13px; min-width: 84px; }
.theme-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.theme-prev { display: grid; grid-template-rows: 1fr 4px 10px 4px; width: 72px; height: 52px; border-radius: 8px; overflow: hidden; background: var(--sh-grain), var(--sh-back); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.theme-prev i:nth-child(1) { grid-row: 2; background: var(--sh-hi); }

.theme-prev i:nth-child(3) { grid-row: 4; background: var(--sh-lo); }
.menu .sw { margin-inline-end: 2px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.book { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 22px; position: relative; min-width: 0; }
.book .cover-btn { border: 0; padding: 0; background: none; width: 100%; max-width: 168px; display: block; }
.cover {
  width: 100%; aspect-ratio: 1 / 1.38; object-fit: cover; display: block; border-radius: 2px 5px 5px 2px; background: var(--page);
  box-shadow: -4px 0 0 rgba(0,0,0,.08) inset, 0 2px 4px rgba(0,0,0,.18), 0 12px 18px -8px rgba(0,0,0,.45); max-width: 100%;
}
.book-meta { width: 100%; display: flex; align-items: center; gap: 6px; margin-top: 8px; margin-bottom: 6px; min-height: 40px; }
.book-title { font-size: 13.5px; font-weight: 500; line-height: 1.35; flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.book-progress { position: absolute; bottom: 30px; inset-inline: 10%; height: 3px; border-radius: 3px; background: rgba(255,255,255,.35); overflow: hidden; }
.book-progress > i { display: block; height: 100%; background: var(--accent); }
.book .more { width: 32px; height: 32px; border-radius: 8px; flex: none; }
.menu { position: absolute; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; min-width: 190px; bottom: 70px; inset-inline-end: 0; }
.menu button { display: flex; width: 100%; gap: 10px; align-items: center; border: 0; background: none; padding: 10px 12px; border-radius: 10px; text-align: start; min-height: 44px; }
.menu button:hover { background: var(--surface-2); }
.menu .confirm { padding: 8px 10px; font-size: 14px; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.drop-hint { border: 2px dashed var(--line); border-radius: 18px; padding: 18px; text-align: center; color: var(--muted); margin-top: 22px; font-size: 14px; }

/* Reader */
#reader { position: fixed; inset: 0; z-index: 30; background: var(--paper); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
#reader[hidden] { display: none !important; }
.r-top {
  display: flex; align-items: center; gap: 6px; padding-block: 8px; padding-top: calc(8px + env(safe-area-inset-top, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.r-title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-inline: 6px; }
.r-pageno { font-size: 14px; color: var(--muted); padding-inline: 8px; white-space: nowrap; }
.r-body { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; position: relative; }
.r-body.with-panel { grid-template-columns: minmax(0, 1fr) minmax(320px, 42%); }
.stage { position: relative; display: grid; place-items: center; overflow: hidden; touch-action: pan-y; padding: 16px; min-width: 0; }
.stage.pen-on { padding-top: 84px; }
.page-wrap { position: relative; background: var(--page); box-shadow: var(--shadow); max-width: 100%; }
.page-wrap canvas.pdf { display: block; width: 100%; height: 100%; }
.page-wrap.turn-next { animation: turnNext .32s ease-out; }
.page-wrap.turn-prev { animation: turnPrev .32s ease-out; }
@keyframes turnNext { from { transform: translateX(-40px) rotateY(6deg); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes turnPrev { from { transform: translateX(40px) rotateY(-6deg); opacity: .2; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .page-wrap.turn-next, .page-wrap.turn-prev { animation: none; } }
.ink-layer { position: absolute; inset: 0; mix-blend-mode: multiply; }
.ink-layer canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.ink-layer.active { touch-action: none; cursor: crosshair; }
.ink-layer:not(.active) { pointer-events: none; }
.bookmark-flag { position: absolute; top: -4px; inset-inline-start: 24px; width: 22px; height: 46px; background: var(--danger); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
.tap-zone { position: absolute; top: 0; bottom: 0; width: 18%; z-index: 2; border: 0; background: none; }
.tap-zone.next { left: 0; }
.tap-zone.prev { right: 0; }
.book-view { position: relative; perspective: 2600px; flex: none; }
.book-view .pg { position: absolute; top: 0; background: var(--page); overflow: hidden; box-shadow: var(--shadow); }
.book-view .pg.blank { background: var(--surface-2); box-shadow: none; }
.book-view .pg canvas.pdf { display: block; width: 100%; height: 100%; }
.book-view.double .pg[data-side="right"] { box-shadow: 6px 2px 14px -6px rgba(0,0,0,.25), var(--shadow); }
.book-view .spine { position: absolute; top: 0; bottom: 0; left: calc(50% - 34px); width: 68px; pointer-events: none; z-index: 3;
  background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.06) 30%, rgba(0,0,0,.22) 49%, rgba(255,255,255,.12) 51%, rgba(0,0,0,.06) 70%, rgba(0,0,0,0) 100%); }
.book-view.turn-next { animation: turnNext .32s ease-out; }
.book-view.turn-prev { animation: turnPrev .32s ease-out; }
.leaf { position: absolute; top: 0; z-index: 6; pointer-events: none; transform-style: preserve-3d; }
.leaf.mirror { transform: scaleX(-1); }
.leaf .strip { position: absolute; top: 0; transform-style: preserve-3d; transform-origin: left center; will-change: transform; }
.leaf .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.leaf .face.back { transform: rotateY(180deg); }
.leaf .face canvas { display: block; width: 100%; height: 100%; }
.leaf .shade { position: absolute; inset: 0; }
.tap-zone:focus-visible { outline: none; background: linear-gradient(90deg, transparent, rgba(30,106,100,.06), transparent); }
.turn-dim { position: absolute; top: 0; z-index: 5; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.9), rgba(0,0,0,.55)); opacity: 0; }
.pg-label { font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.ocr-text section:first-child .pg-label { margin-top: 0; }
.ocr-text mark.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
/* Annotations drawer (left edge) */
.drawer { position: absolute; top: 0; bottom: 0; left: 0; width: min(380px, 92%); z-index: 9; background: var(--surface); border-right: 1px solid var(--line);
  box-shadow: 8px 0 30px -12px rgba(0,0,0,.35); display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); animation: drawerIn .22s ease-out; }
@keyframes drawerIn { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
.dr-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px 16px; }
.dr-head h2 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; }
.dr-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 14px 8px; }
.dr-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 11px; min-height: 34px; font-size: 13.5px; }
.dr-chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.r-bottom {

/* Notes */
.notes-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }

.note-page {

/* Stats */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }

.pbar .track i { display: block; height: 100%; background: var(--chart-1); border-radius: 8px; transition: width .4s; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: middle; }

.settings { display: grid; gap: 14px; max-width: 720px; }
